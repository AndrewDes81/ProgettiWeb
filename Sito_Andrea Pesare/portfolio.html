<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – TEMA Carpenteria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="img/logo-navbar.png" alt="Logo TEMA" class="logo-navbar">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#servizi">Servizi</a></li>
                    <li class="nav-item"><a class="nav-link active" href="portfolio.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="contatti.html">Contatti</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <header class="py-5 mt-4 text-center">
        <div class="container">
            <h1 class="fw-bold text-uppercase">Portfolio</h1>
            <p class="lead">Una selezione dei nostri lavori realizzati.</p>
        </div>
    </header>

    <!-- FILTRI -->
    <div class="container mb-4 text-center">
        <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="all">Tutti</button>
        <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="infissi">Infissi</button>
        <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="arredo">Design & Arredo</button>
        <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="materiali">Materiali Speciali</button>
        <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="progettazione">Progettazione Tecnica</button>
    </div>

    <!-- GALLERIA -->
    <section id="portfolio-section">
        <div class="container">
            <div class="row g-4 portfolio-row">

                <!-- INFISSI -->
                <div class="col-md-4 portfolio-col infissi">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/infissi1.jpg" class="img-fluid rounded shadow-sm" alt="Infissi 1">
                    </div>
                </div>

                <div class="col-md-4 portfolio-col infissi">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/infissi2.jpg" class="img-fluid rounded shadow-sm" alt="Infissi 2">
                    </div>
                </div>
                
                <div class="col-md-4 portfolio-col infissi">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/infissi3.jpg" class="img-fluid rounded shadow-sm" alt="Infissi 3">
                    </div>
                </div>

                <!-- ARREDO -->
                <div class="col-md-4 portfolio-col arredo">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/arredo1.jpg" class="img-fluid rounded shadow-sm" alt="Arredo 1">
                    </div>
                </div>

                <div class="col-md-4 portfolio-col arredo">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/arredo2.jpg" class="img-fluid rounded shadow-sm" alt="Arredo 2">
                    </div>
                </div>

                <div class="col-md-4 portfolio-col arredo">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/arredo3.jpg" class="img-fluid rounded shadow-sm" alt="Arredo 3">
                    </div>
                </div>

                <!-- MATERIALI SPECIALI -->
                <div class="col-md-4 portfolio-col materiali">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/materiale1.webp" class="img-fluid rounded shadow-sm" alt="Materiale 1">
                    </div>
                </div>

                <div class="col-md-4 portfolio-col materiali">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/materiale2.webp" class="img-fluid rounded shadow-sm" alt="Materiale 2">
                    </div>
                </div>

                <div class="col-md-4 portfolio-col materiali">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/materiale3.1.webp" class="img-fluid rounded shadow-sm" alt="Materiale 3.1">
                    </div>
                </div>

                <!-- PROGETTAZIONE -->
                <div class="col-md-4 portfolio-col progettazione">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/progetto1.png" class="img-fluid rounded shadow-sm" alt="Progetto 1">
                    </div>
                </div>

                <div class="col-md-4 portfolio-col progettazione">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/progetto2.png" class="img-fluid rounded shadow-sm" alt="Progetto 2">
                    </div>
                </div>

                 <div class="col-md-4 portfolio-col progettazione">
                    <div class="portfolio-item">
                        <img src="img/Portfolio/progetto2.png" class="img-fluid rounded shadow-sm" alt="Progetto 3">
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- JS FILTRI -->
    <script>
        const buttons = document.querySelectorAll('.filter-btn');
        const items = document.querySelectorAll('.portfolio-col');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.getAttribute('data-filter');

                items.forEach(item => {
                    if (filter === 'all' || item.classList.contains(filter)) {
                        item.classList.remove('d-none');
                    } else {
                        item.classList.add('d-none');
                    }
                });
            });
        });
    </script>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 ADS Design - Sviluppato da Andrea DeSantis | Tutti i diritti riservati</p>
    </footer>

</body>
</html>
